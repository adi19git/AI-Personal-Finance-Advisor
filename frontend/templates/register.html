{% extends "base.html" %}
{% block title %}Register - AI Finance Advisor{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <i class="bi bi-wallet2 text-primary display-4"></i>
            <h3 class="fw-bold mt-2">Create Account</h3>
            <p class="text-muted">Start managing your finances with AI</p>
        </div>
        <div class="card">
            <div class="card-body p-4">
                <div id="registerAlert" class="alert alert-danger d-none"></div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Full Name</label>
                        <input type="text" class="form-control form-control-lg" id="regFullName" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Email</label>
                        <input type="email" class="form-control form-control-lg" id="regEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Username</label>
                        <input type="text" class="form-control form-control-lg" id="regUsername" placeholder="Choose a username" required minlength="3">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small">Password</label>
                        <input type="password" class="form-control form-control-lg" id="regPassword" placeholder="Min. 6 characters" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Create Account</button>
                </form>
                
                <div class="text-center mt-4">
                    <span class="text-muted">Already have an account?</span> <a href="/login" class="fw-bold">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    requireGuest();
});
</script>
{% endblock %}
